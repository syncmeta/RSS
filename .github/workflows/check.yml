name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s deploy/rss-stack/tests -v
      - name: Validate Compose
        working-directory: deploy/rss-stack
        run: |
          cp .env.example .env
          docker compose config --quiet
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Newsletter Worker without deployment
        working-directory: newsletter-rss
        run: |
          npm ci
          npm run deploy -- --dry-run
