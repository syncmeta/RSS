server {
    listen 80;
    listen 8000;
    server_name _;

    location ^~ /rss/ {
        proxy_pass http://rssbox-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 由 ext-fetch 侧车用 curl 抓下来的外部 feed：这些源(如 linux.do)在
    # Cloudflare 后面按 TLS 指纹拦截，rssbox/node 直连一律 403，curl 才放行。
    location ^~ /ext/ {
        alias /srv/ext/;
        default_type application/rss+xml;
        autoindex off;
    }

    location / {
        return 403;
    }
}
